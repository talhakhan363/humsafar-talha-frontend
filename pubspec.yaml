name: humsafar_frontend
description: Humsafar — Flutter frontend (Guardian + Dependent apps). Talha's personal working repo.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Task 1.10 — localization scaffold.
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Task 1.10 — tells the Flutter tool to generate AppLocalizations from
  # lib/l10n/*.arb (config in l10n.yaml) every time `flutter pub get` runs.
  generate: true
