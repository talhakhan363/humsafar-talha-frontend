name: humsafar_frontend
description: Humsafar — Flutter frontend (Guardian + Dependent apps). Talha's personal working repo.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Task 1.10 — localization scaffold.
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  cupertino_icons: ^1.0.6
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.1.2

  # Task 2.6 — Live Map. flutter_map (OpenStreetMap tiles) instead of
  # google_maps_flutter: no Google Cloud project, no billing-enabled API
  # key, no account setup at all. Does everything 2.6 needs (a marker +
  # circle overlays on a basemap) without the external-service detour.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Task 2.7 — background location service. geolocator handles permission
  # requests + reading GPS fixes; battery_plus reads the battery level the
  # location_contract.md POST body optionally carries (feeds Task 2.3's
  # low-battery alert on the backend). Both are wrapped behind
  # DeviceLocationSource (lib/core/location/) so the polling logic itself
  # stays unit-testable without a real device.
  geolocator: ^13.0.2
  battery_plus: ^6.2.1

  # Task 3.14 — Firebase Cloud Messaging. firebase_core bootstraps the app
  # against google-services.json; firebase_messaging is the actual push
  # client (token, foreground/background/terminated message streams).
  # flutter_local_notifications displays the local heads-up/standard
  # notification while the app is in the foreground — FCM's own
  # `notification` payload is only auto-displayed by the OS when the app
  # is backgrounded or terminated, never while it's open and in front of
  # the person, so a foreground critical alert needs this to be visible
  # at all.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # Task 3.14 — the Alerts/Missed-dose/Alarm screens' "Call" buttons
  # (mockups 08b, 24) are this app's first phone-dialing feature. Opens
  # the device's own dialer via a tel: URI (ACTION_DIAL) rather than
  # placing the call directly — no CALL_PHONE permission needed, and the
  # person still has to press the dial button themselves.
  url_launcher: ^6.3.1

  # Task 4.8 — priority voice messages. `record` captures the Guardian's
  # mic input to a file (wrapped behind AudioRecorderSource,
  # lib/core/audio/, so the recording UI stays unit-testable without a
  # real microphone — same seam shape as `DeviceLocationSource`, Task
  # 2.7); `audioplayers` plays back both the pre-send preview and a
  # received voice message's downloaded bytes (wrapped behind
  # AudioPlayerSource, same reasoning). `path_provider` is what both of
  # those use to get a real temp-file path for the plugins to read from/
  # write to — this app's first use of on-device temp files.
  record: ^6.2.1
  audioplayers: ^6.6.0
  path_provider: ^2.1.4

  # Task 5.6 — Medical records upload (records_contract.md: PDF, JPEG or
  # PNG). `file_picker` is what actually opens the system's file/photo
  # chooser; wrapped behind FilePickerSource (lib/core/files/) for the
  # same unit-testability reason as every other native plugin here.
  # Pinned to 11.0.3, not the newest release — checked against pub.dev's
  # own version history the same way `record`/`audioplayers` were
  # corrected for Task 4.6/4.8: 12.0.0+ needs Flutter >=3.38.0, too new
  # for Talha's installed 3.32.1; 11.0.3 only needs >=3.22.0 and exposes
  # the identical pickFiles API this code uses.
  file_picker: ^11.0.3
  #
  # Task 4.7 fix, 2026-10-22 (Talha's real `flutter pub get` run): this
  # declared ^11.0.3 is now force-overridden down to exactly 10.3.8 — see
  # the `dependency_overrides` block at the bottom of this file and
  # zego_uikit_prebuilt_call's own comment below for why. Left as
  # ^11.0.3 here (not edited down directly) so this line still documents
  # what the app would normally want; the override is what actually wins.

  # Tasks 5.6/5.7 — sharing the exported records/vitals PDF and the
  # doctor-link URL through the OS share sheet, instead of building an
  # in-app PDF/image viewer (named scope cut, see medical_vault_screen.dart).
  # Wrapped behind ShareSource (lib/core/sharing/), same reasoning as
  # file_picker above. Pinned to 12.0.1 for the same reason: 13.0.0+
  # needs Flutter >=3.41.0; 12.0.1 only needs >=3.22.0 and uses the same
  # SharePlus.instance.share(ShareParams(...)) API this code calls (the
  # pre-12 Share.share()/Share.shareXFiles() statics are deprecated but
  # would also have worked — 12.0.1 was picked for its iOS 26 crash fix,
  # not because the newer API was required).
  share_plus: ^12.0.1

  # Screen 05 "Share my ID" fix + Task 6.9 — qr_flutter renders the QR
  # code on the Share-My-ID screen (an elderly Dependent showing their ID
  # to a Guardian in person is faster than reading digits aloud). Pure-
  # Dart rendering (no platform channel), so it's also usable directly in
  # widget tests, unlike every native plugin above. Pinned to 4.1.0 (its
  # latest release) rather than left unbounded — same version-floor
  # discipline as file_picker/share_plus/record/audioplayers above, even
  # though this package's own floor is low enough (pre-null-safety 3.x
  # exists for very old Flutter only) that 4.1.0 works fine against
  # Talha's installed 3.32.1.
  qr_flutter: ^4.1.0

  # Task 7.3 — Analytics dashboard. fl_chart draws the adherence bar
  # chart and the vitals trend line chart. Same "pure Dart, no platform
  # channel" reasoning as qr_flutter above (its only runtime
  # dependencies are `equatable` and `vector_math` plus the Flutter SDK
  # itself) — safe to render directly inside `flutter_test` widget
  # tests, unlike every native plugin elsewhere in this app.
  #
  # Fix #1, 2026-10-22 (Talha's real `flutter pub get` run): the first
  # pin here, `^1.3.0`, failed to resolve — `fl_chart` 1.1.1 onward
  # declares `vector_math: ^2.2.0`, which `flutter pub get` can't
  # satisfy alongside `flutter_test`'s own `vector_math: 2.1.4` pin.
  # Pinned to exactly `1.1.0` to dodge that declared-constraint clash.
  #
  # Fix #2, 2026-10-22 (Talha's real `flutter test` run, same day): pub
  # get succeeded, but compiling still failed — fl_chart 1.1.0's own
  # `custom_interactive_viewer.dart` CALLS `Matrix4.translateByDouble`/
  # `scaleByDouble`, which don't exist until `vector_math` 2.2.0 (added
  # in that release; see pub.dev/packages/vector_math/changelog). So
  # fl_chart 1.1.0's declared `vector_math: ^2.1.4` constraint was
  # simply wrong — its actual code already needs 2.2.0+, confirmed as a
  # known fl_chart bug (github.com/imaNNeo/fl_chart issues #1985/#1986/
  # #2046, same error, same version). No older/newer fl_chart avoids
  # this — the fix is forcing `vector_math` itself to 2.2.0 via
  # `dependency_overrides` below (confirmed by multiple reporters on
  # those issues); `vector_math` 2.2.0's own changelog describes the
  # change as additive ("new members added"), not breaking, so this
  # shouldn't put `flutter_test` at risk. fl_chart can stay at `1.1.0`
  # exactly — no need to also bump it now that the real constraint
  # (vector_math) is satisfied directly.
  fl_chart: 1.1.0

  # Task 4.7 — Voice/video call UI. zego_uikit_prebuilt_call is
  # ZegoCloud's prebuilt Flutter Call UIKit — the actual video/audio
  # widget is dropped in as-is (`call_screen.dart`); everything else
  # (starting/accepting/declining, this app's own "Calling.../Incoming
  # call" screens) is plain Dart against `call_contract.md`, not part of
  # this SDK. This app's first native-SDK dependency, by far the
  # highest-risk pin in this file so far — flagged in detail:
  #
  # Version floor risk (2026-10-22, could not be confirmed without a
  # real `flutter pub get` — same category of risk that caused the real
  # fl_chart failures above, named here up front instead of guessed
  # silently): the package's CURRENT published version (4.24.6,
  # 2026-10-22) declares `environment.flutter: '>=3.44.0'` — newer than
  # Talha's installed Flutter 3.32.1, confirmed from its GitHub
  # pubspec.yaml. Its changelog states this floor was raised specifically
  # in 4.24.6 ("Require Dart 3.12.0, Flutter 3.44.0...") — no earlier
  # changelog entry mentions a Flutter-version bump, and 4.16.24 notes
  # only a "Flutter 3.29.0 Adaptation", suggesting whatever floor was set
  # around then stayed unchanged through 4.24.5. Pinned to the last
  # version before that bump, exactly (not `^4.24.5`, same "don't let pub
  # resolve forward into the next breaking version" reasoning as
  # `fl_chart: 1.1.0` above) — but this is inferred from changelog
  # wording, not a confirmed `environment.flutter` read of 4.24.5's own
  # pubspec.yaml (pub.dev's pages didn't expose it to this sandbox's
  # tooling). If `flutter pub get` still fails on this line, that's the
  # first thing to suspect — send the real error and an older/newer exact
  # pin is a quick follow-up, same as the fl_chart round above.
  #
  # Also unverified: this package pulls in roughly two dozen transitive
  # packages of its own (ZEGOCLOUD's `zego_uikit`/`zego_plugin_adapter`,
  # plus `permission_handler` and others) — any one of them could, in
  # principle, hit the same "declared constraint doesn't match real
  # code" bug fl_chart's `vector_math` dependency did. Not something this
  # sandbox (no `flutter` binary) can rule out in advance.
  #
  # Auth: constructed with `token:` (not `appSign:`), confirmed from the
  # package's own published API reference — logs in with `appID` (public,
  # fine to embed) + a per-call `token` our backend generates server-side
  # (Task 4.4b). The ZegoCloud Server Secret never ships in this app.
  zego_uikit_prebuilt_call: 4.24.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Task 7.3 fix #2 (2026-10-22) — see fl_chart's comment above. Forces the
# `vector_math` version flutter_test otherwise pins at `2.1.4` up to
# `2.2.0`, which is what fl_chart 1.1.0's interactive-viewer code actually
# needs to compile (a mismatch between fl_chart's declared constraint and
# its real code — not something our own code can work around any other
# way). Confirmed working by multiple reporters hitting this exact error
# on fl_chart's own issue tracker.
dependency_overrides:
  vector_math: 2.2.0
  # Task 4.7 fix, 2026-10-22 — see zego_uikit_prebuilt_call's comment
  # above. zego_uikit (its transitive dependency) pins file_picker to
  # exactly 10.3.8; this app's own direct dependency wants ^11.0.3. This
  # override forces 10.3.8 so both are satisfied by the same version,
  # same mechanism as the vector_math line above.
  file_picker: 10.3.8

flutter:
  uses-material-design: true
  # Task 1.10 — tells the Flutter tool to generate AppLocalizations from
  # lib/l10n/*.arb (config in l10n.yaml) every time `flutter pub get` runs.
  generate: true
