name: humsafar_frontend
description: Humsafar — Flutter frontend (Guardian + Dependent apps). Talha's personal working repo.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Task 1.10 — localization scaffold.
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  cupertino_icons: ^1.0.6
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.1.2

  # Task 2.6 — Live Map. flutter_map (OpenStreetMap tiles) instead of
  # google_maps_flutter: no Google Cloud project, no billing-enabled API
  # key, no account setup at all. Does everything 2.6 needs (a marker +
  # circle overlays on a basemap) without the external-service detour.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Task 2.7 — background location service. geolocator handles permission
  # requests + reading GPS fixes; battery_plus reads the battery level the
  # location_contract.md POST body optionally carries (feeds Task 2.3's
  # low-battery alert on the backend). Both are wrapped behind
  # DeviceLocationSource (lib/core/location/) so the polling logic itself
  # stays unit-testable without a real device.
  geolocator: ^13.0.2
  battery_plus: ^6.2.1

  # Task 3.14 — Firebase Cloud Messaging. firebase_core bootstraps the app
  # against google-services.json; firebase_messaging is the actual push
  # client (token, foreground/background/terminated message streams).
  # flutter_local_notifications displays the local heads-up/standard
  # notification while the app is in the foreground — FCM's own
  # `notification` payload is only auto-displayed by the OS when the app
  # is backgrounded or terminated, never while it's open and in front of
  # the person, so a foreground critical alert needs this to be visible
  # at all.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # Task 3.14 — the Alerts/Missed-dose/Alarm screens' "Call" buttons
  # (mockups 08b, 24) are this app's first phone-dialing feature. Opens
  # the device's own dialer via a tel: URI (ACTION_DIAL) rather than
  # placing the call directly — no CALL_PHONE permission needed, and the
  # person still has to press the dial button themselves.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Task 1.10 — tells the Flutter tool to generate AppLocalizations from
  # lib/l10n/*.arb (config in l10n.yaml) every time `flutter pub get` runs.
  generate: true
