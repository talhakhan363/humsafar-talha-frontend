name: humsafar_frontend
description: Humsafar — Flutter frontend (Guardian + Dependent apps). Talha's personal working repo.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Task 1.10 — localization scaffold.
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  cupertino_icons: ^1.0.6
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.1.2

  # Task 2.6 — Live Map. flutter_map (OpenStreetMap tiles) instead of
  # google_maps_flutter: no Google Cloud project, no billing-enabled API
  # key, no account setup at all. Does everything 2.6 needs (a marker +
  # circle overlays on a basemap) without the external-service detour.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Task 2.7 — background location service. geolocator handles permission
  # requests + reading GPS fixes; battery_plus reads the battery level the
  # location_contract.md POST body optionally carries (feeds Task 2.3's
  # low-battery alert on the backend). Both are wrapped behind
  # DeviceLocationSource (lib/core/location/) so the polling logic itself
  # stays unit-testable without a real device.
  geolocator: ^13.0.2
  battery_plus: ^6.2.1

  # Task 3.14 — Firebase Cloud Messaging. firebase_core bootstraps the app
  # against google-services.json; firebase_messaging is the actual push
  # client (token, foreground/background/terminated message streams).
  # flutter_local_notifications displays the local heads-up/standard
  # notification while the app is in the foreground — FCM's own
  # `notification` payload is only auto-displayed by the OS when the app
  # is backgrounded or terminated, never while it's open and in front of
  # the person, so a foreground critical alert needs this to be visible
  # at all.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # Task 3.14 — the Alerts/Missed-dose/Alarm screens' "Call" buttons
  # (mockups 08b, 24) are this app's first phone-dialing feature. Opens
  # the device's own dialer via a tel: URI (ACTION_DIAL) rather than
  # placing the call directly — no CALL_PHONE permission needed, and the
  # person still has to press the dial button themselves.
  url_launcher: ^6.3.1

  # Task 4.8 — priority voice messages. `record` captures the Guardian's
  # mic input to a file (wrapped behind AudioRecorderSource,
  # lib/core/audio/, so the recording UI stays unit-testable without a
  # real microphone — same seam shape as `DeviceLocationSource`, Task
  # 2.7); `audioplayers` plays back both the pre-send preview and a
  # received voice message's downloaded bytes (wrapped behind
  # AudioPlayerSource, same reasoning). `path_provider` is what both of
  # those use to get a real temp-file path for the plugins to read from/
  # write to — this app's first use of on-device temp files.
  record: ^6.2.1
  audioplayers: ^6.6.0
  path_provider: ^2.1.4

  # Task 5.6 — Medical records upload (records_contract.md: PDF, JPEG or
  # PNG). `file_picker` is what actually opens the system's file/photo
  # chooser; wrapped behind FilePickerSource (lib/core/files/) for the
  # same unit-testability reason as every other native plugin here.
  # Pinned to 11.0.3, not the newest release — checked against pub.dev's
  # own version history the same way `record`/`audioplayers` were
  # corrected for Task 4.6/4.8: 12.0.0+ needs Flutter >=3.38.0, too new
  # for Talha's installed 3.32.1; 11.0.3 only needs >=3.22.0 and exposes
  # the identical pickFiles API this code uses.
  file_picker: ^11.0.3

  # Tasks 5.6/5.7 — sharing the exported records/vitals PDF and the
  # doctor-link URL through the OS share sheet, instead of building an
  # in-app PDF/image viewer (named scope cut, see medical_vault_screen.dart).
  # Wrapped behind ShareSource (lib/core/sharing/), same reasoning as
  # file_picker above. Pinned to 12.0.1 for the same reason: 13.0.0+
  # needs Flutter >=3.41.0; 12.0.1 only needs >=3.22.0 and uses the same
  # SharePlus.instance.share(ShareParams(...)) API this code calls (the
  # pre-12 Share.share()/Share.shareXFiles() statics are deprecated but
  # would also have worked — 12.0.1 was picked for its iOS 26 crash fix,
  # not because the newer API was required).
  share_plus: ^12.0.1

  # Screen 05 "Share my ID" fix + Task 6.9 — qr_flutter renders the QR
  # code on the Share-My-ID screen (an elderly Dependent showing their ID
  # to a Guardian in person is faster than reading digits aloud). Pure-
  # Dart rendering (no platform channel), so it's also usable directly in
  # widget tests, unlike every native plugin above. Pinned to 4.1.0 (its
  # latest release) rather than left unbounded — same version-floor
  # discipline as file_picker/share_plus/record/audioplayers above, even
  # though this package's own floor is low enough (pre-null-safety 3.x
  # exists for very old Flutter only) that 4.1.0 works fine against
  # Talha's installed 3.32.1.
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Task 1.10 — tells the Flutter tool to generate AppLocalizations from
  # lib/l10n/*.arb (config in l10n.yaml) every time `flutter pub get` runs.
  generate: true
