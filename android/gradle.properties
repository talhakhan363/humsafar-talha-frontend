org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# 2026-10-23 - disabled: the Pub package cache (C:\Users\dell\AppData\Local\Pub\Cache)
# and this project (D:\humsafar-talha-frontend) are on different Windows drives, which
# breaks Kotlin's incremental-compiler cache (it computes relative paths between them,
# and Windows can't compute a relative path across drive letters -- "this and base files
# have different roots"). Harmless but very noisy, and it silently disables real
# incremental compilation anyway, so builds are full rebuilds every time regardless.
# Explicitly turning it off here stops Gradle from attempting and failing at it.
kotlin.incremental=false
